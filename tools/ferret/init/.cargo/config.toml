# Freestanding x86_64 userspace init, statically linked, no libc.
#
# -static is required: without it rust-lld emits a static-PIE (ET_DYN) with an
# R_X86_64_RELATIVE relocation that no dynamic loader will apply in the
# initramfs.
[target.x86_64-unknown-none]
rustflags = [
  "-C", "relocation-model=static",
  "-C", "link-arg=-static",
  "-C", "link-arg=-no-pie",
  "-C", "link-arg=-e",
  "-C", "link-arg=_start",
  "-C", "link-arg=-z",
  "-C", "link-arg=max-page-size=4096",
]
